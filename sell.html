<main class="max-w-3xl mx-auto px-4 py-8">
<h1 class="text-3xl font-800 mb-2">Create New Listing</h1>
<p class="text-[var(--text-secondary)] mb-8">Fill in the details to list your digital product or service</p>
<form data-validate class="space-y-6 bg-[var(--bg-card)] border border-[var(--border)] rounded-2xl p-6 md:p-8">
<div><label class="form-label">Listing Type</label><div class="grid grid-cols-2 gap-3"><label class="flex items-center gap-2 border border-[var(--border)] rounded-lg p-4 cursor-pointer hover:border-primary transition"><input type="radio" name="listing-type" value="service" class="accent-primary" checked><div><div class="font-semibold">Service</div><div class="text-sm text-[var(--text-secondary)]">Offer your skills</div></div></label><label class="flex items-center gap-2 border border-[var(--border)] rounded-lg p-4 cursor-pointer hover:border-primary transition"><input type="radio" name="listing-type" value="product" class="accent-primary"><div><div class="font-semibold">Digital Product</div><div class="text-sm text-[var(--text-secondary)]">Sell a downloadable</div></div></label></div></div>
<div><label class="form-label" for="title">Title</label><input id="title" type="text" class="form-input" placeholder="E.g., Professional Logo Design" required><p class="field-error text-red-500 text-sm mt-1"></p></div>
<div><label class="form-label" for="category">Category</label><select id="category" class="form-input" required><option value="">Select category</option><option data-i18n="cat_design">Design</option><option data-i18n="cat_development">Development</option><option data-i18n="cat_writing">Writing</option><option data-i18n="cat_marketing">Marketing</option><option data-i18n="cat_music">Music</option><option data-i18n="cat_video">Video</option></select><p class="field-error text-red-500 text-sm mt-1"></p></div>
<div><label class="form-label" for="description">Description</label><textarea id="description" class="form-input" rows="5" placeholder="Describe your product or service in detail..." required></textarea><p class="field-error text-red-500 text-sm mt-1"></p></div>
<div class="grid grid-cols-2 gap-4">
<div><label class="form-label" for="price">Price ($)</label><input id="price" type="number" class="form-input" placeholder="49.99" min="1" required><p class="field-error text-red-500 text-sm mt-1"></p></div>
<div><label class="form-label" for="delivery">Delivery Time</label><select id="delivery" class="form-input"><option>1-3 days</option><option>3-5 days</option><option>1 week</option><option>2 weeks</option><option>Instant (digital download)</option></select></div>
</div>
<div><label class="form-label">Thumbnail Image</label><div class="border-2 border-dashed border-[var(--border)] rounded-xl p-8 text-center hover:border-primary transition cursor-pointer"><i class="fas fa-cloud-upload-alt text-3xl text-[var(--text-secondary)] mb-2"></i><p class="text-[var(--text-secondary)]">Drag & drop or click to upload</p><p class="text-sm text-[var(--text-secondary)] mt-1">PNG, JPG up to 5MB</p><input type="file" class="hidden" accept="image/*"></div></div>
<div><label class="form-label">Tags</label><input type="text" class="form-input" placeholder="logo, branding, design (comma separated)"></div>
<div class="flex gap-3 pt-4">
<button type="submit" class="btn-primary flex-1 py-3"><i class="fas fa-rocket mr-2"></i>Publish Listing</button>
<button type="button" class="btn-outline flex-1 py-3">Save as Draft</button>
</div>
</form>
</main>
